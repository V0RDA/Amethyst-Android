# Сборка движка для лаунчера VORDA (форк Amethyst-Android, GNU LGPL-3.0).
# Результат — артефакт vorda-engine-bundle:
#   repo/        Maven-репозиторий ru.playvorda:vorda-engine (AAR + POM с зависимостями)
#   aars/        нативные AAR upstream (MobileGlues, SDL, LWJGL natives, OpenAL, Kopper Zink…) — их кладёт в APK лаунчер
#   assets/engine-runtimes/  Java 17 и 21 для arm64 (.tar.xz) из релизов AngelAuraMC/angelauramc-openjdk-build (SHA-256 вшиты) — в assets APK
#   VERSION      версия движка (для зависимости ru.playvorda:vorda-engine)
#   SHA256SUMS   контрольные суммы всех файлов пакета — лаунчер сверяет их при подключении
# Секреты не нужны: ключи подписи upstream удалены из форка, APK движок не собирает.
name: VORDA engine

on:
  push:
    branches: [ 'vorda/**' ]
    tags: [ 'vorda-engine-*' ]
  workflow_dispatch:

permissions:
  contents: write   # только для выпуска релиза по тегу

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VORDA_ENGINE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-{0}', github.run_number) }}
    steps:
      - name: Checkout (с сабмодулями SDL, MobileGlues, MioLibPatcher, androidnsbypass)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java 17 и 21 для Android (arm64) — релизы AngelAuraMC/angelauramc-openjdk-build, SHA-256 вшиты
        run: |
          set -euo pipefail
          mkdir -p dl
          base=https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download
          curl -fsSL -o dl/jre17-arm64.tar.xz "$base/download_jre17/jre17-android-arm64.tar.xz"
          curl -fsSL -o dl/jre21-arm64.tar.xz "$base/download_jre21/jre21-android-arm64.tar.xz"
          # Хеши из релизов upstream (опубликованы GitHub 04.04.2026). Новая сборка JRE — обновить хеши осознанно.
          echo 'e162c860fe05ee4a4e4af7606437419879f6c748386a7b09fa77d10db6a64091  dl/jre17-arm64.tar.xz' > dl/SHA256SUMS
          echo '8d41ec401ee59f7722df60ed991f81ad146e130452804bfdd8a05d3436f7bbfe  dl/jre21-arm64.tar.xz' >> dl/SHA256SUMS
          sha256sum -c dl/SHA256SUMS

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Сборка движка (AAR) и Maven-репозиторий
        run: |
          set -o pipefail
          gradle :vorda_engine:assembleRelease :vorda_engine:publishReleasePublicationToMavenRepository --stacktrace 2>&1 | tee build.log

      # Журналы Actions видны только после входа в GitHub. Причину падения выводим аннотациями —
      # их отдаёт открытый API (check-runs/<id>/annotations), так лаунчер-разработчик читает их без входа.
      - name: Причина падения — в аннотации
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          wrong=$(awk '/What went wrong/{f=1} f{print} /Try:/{if(f) exit}' build.log | head -60 | cut -c1-300 | enc)
          errs=$(grep -E '(error:|^e: |\.java:[0-9]+: |Execution failed|Could not (resolve|find|get)|> )' build.log | grep -v '^\s*at ' | head -60 | cut -c1-300 | enc)
          tail1=$(grep -v '^\s*at ' build.log | tail -70 | cut -c1-300 | enc)
          echo "::error title=What went wrong::${wrong}"
          echo "::error title=Errors::${errs}"
          echo "::error title=Tail::${tail1}"

      - name: Пакет vorda-engine-bundle
        run: |
          set -euo pipefail
          B=out/vorda-engine-bundle
          mkdir -p "$B/aars" "$B/assets/engine-runtimes"
          cp -r vorda_engine/build/repo "$B/repo"
          cp app_pojavlauncher/libs/*.aar "$B/aars/"
          # Из архивов JRE берём только arm64 (имя вида jre17-arm64-*.tar.xz) и называем единообразно.
          cp dl/jre17-arm64.tar.xz dl/jre21-arm64.tar.xz "$B/assets/engine-runtimes/"
          (cd "$B/assets/engine-runtimes" && sha256sum *.tar.xz > SHA256SUMS)   # лаунчер сверяет JRE перед установкой
          echo "$VORDA_ENGINE_VERSION" > "$B/VERSION"
          cp LICENSE "$B/LICENSE-LGPL-3.0.txt"
          cp VORDA.md "$B/"
          (cd "$B" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$B/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: vorda-engine-bundle
          path: out/vorda-engine-bundle
          if-no-files-found: error

      - name: Релиз по тегу
        if: github.ref_type == 'tag'
        run: |
          cd out && zip -qr "vorda-engine-bundle-${VORDA_ENGINE_VERSION}.zip" vorda-engine-bundle
          sha256sum "vorda-engine-bundle-${VORDA_ENGINE_VERSION}.zip" > "vorda-engine-bundle-${VORDA_ENGINE_VERSION}.zip.sha256"
          gh release create "${GITHUB_REF_NAME}" "vorda-engine-bundle-${VORDA_ENGINE_VERSION}.zip"* \
            --title "VORDA engine ${VORDA_ENGINE_VERSION}" --notes-file ../VORDA.md
        env:
          GH_TOKEN: ${{ github.token }}
